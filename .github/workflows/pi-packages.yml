name: Pi packages

on:
  pull_request:
  push:
    branches: [main]
    tags: ["*-v[0-9]*"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  select:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.targets.outputs.matrix }}
      has-packages: ${{ steps.targets.outputs.has-packages }}
      is-release: ${{ steps.targets.outputs.is-release }}
      check-auto-review-platforms: ${{ steps.targets.outputs.check-auto-review-platforms }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          package-manager-cache: false
      - uses: pnpm/action-setup@v4
      - run: pnpm install --filter pi-packages --frozen-lockfile --ignore-scripts
      - name: Select affected apps or the tagged release
        id: targets
        run: node scripts/select-pi-packages.mjs
      - name: Test package selection
        if: steps.targets.outputs.check-selection == 'true'
        run: node --test scripts/select-pi-packages.test.mjs

  checks:
    needs: select
    if: needs.select.outputs.has-packages == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.select.outputs.matrix) }}
    name: Check ${{ matrix.slug }}
    env:
      PACKAGE_NAME: ${{ matrix.name }}
      PACKAGE_DIR: ${{ matrix.path }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          package-manager-cache: false
      - uses: pnpm/action-setup@v4
      - run: pnpm install --frozen-lockfile
      # prepack builds the selected package; only its dependencies need an earlier build.
      # The Codex bundle's prepack already builds its complete dependency tree.
      - name: Build and check the distributable package
        run: |
          pack_args=()
          if node -e "process.exit(require('./$PACKAGE_DIR/package.json').bundleDependencies ? 0 : 1)"; then
            pack_args+=(--config.node-linker=hoisted)
          else
            pnpm --filter "$PACKAGE_NAME^..." run --if-present build
          fi
          pnpm --dir "$PACKAGE_DIR" pack "${pack_args[@]}" --pack-destination "$RUNNER_TEMP/package"
      - run: pnpm --filter "$PACKAGE_NAME" run --if-present lint
      - run: pnpm --filter "$PACKAGE_NAME" typecheck
      - run: pnpm --filter "$PACKAGE_NAME" run --if-present test:unit
      - name: Verify Ollama source and packed runtime contracts
        if: matrix.slug == 'pi-ollama-cloud'
        run: pnpm --filter @buyong/pi-ollama-cloud exec tsx scripts/cli/verify.ts --offline --report "$RUNNER_TEMP/ollama-offline.json"

  # Auto Review's path, shell and PowerShell policy differs by OS; ubuntu already runs in `checks`.
  # Bundle releases still require these checks; unrelated component changes do not.
  auto-review-platforms:
    needs: select
    if: needs.select.outputs.check-auto-review-platforms == 'true'
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
    name: Check pi-codex-auto-review on ${{ matrix.os }}
    defaults:
      run:
        # Windows tests run bash commands through Git Bash, as Pi does.
        shell: bash
    steps:
      # Keep LF line endings so formatting checks and fixtures match the repository.
      - run: git config --global core.autocrlf false && git config --global core.eol lf
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          package-manager-cache: false
      - uses: pnpm/action-setup@v4
      - run: pnpm install --frozen-lockfile
      # Pi downloads the latest fd when none is on PATH. fd 10.5.1 changed Windows --full-path globs,
      # which breaks Pi's own separator rewrite, so Windows uses fd 10.5.0 from PATH.
      - if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $dir = Join-Path $env:RUNNER_TEMP 'fd'
          Invoke-WebRequest https://github.com/sharkdp/fd/releases/download/v10.5.0/fd-v10.5.0-x86_64-pc-windows-msvc.zip -OutFile "$dir.zip"
          Expand-Archive "$dir.zip" -DestinationPath $dir
          Split-Path (Get-ChildItem $dir -Recurse -Filter fd.exe).FullName | Add-Content $env:GITHUB_PATH
      - if: runner.os == 'Windows'
        run: fd --version
      - run: pnpm --filter "@buyong/pi-codex-auto-review..." run build
      - run: pnpm --filter @buyong/pi-codex-auto-review run lint
      - run: pnpm --filter @buyong/pi-codex-auto-review typecheck
      - run: pnpm --filter @buyong/pi-codex-auto-review run test:unit

  ollama-latest:
    needs: select
    if: contains(fromJSON(needs.select.outputs.matrix).include.*.slug, 'pi-ollama-cloud')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    name: Check pi-ollama-cloud with latest Pi
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          package-manager-cache: false
      - uses: pnpm/action-setup@v4
      - run: pnpm install --frozen-lockfile
      # Only this disposable checkout is updated; publishing uses the committed lockfile.
      - name: Install latest host packages
        run: >-
          pnpm --filter @buyong/pi-ollama-cloud add --save-dev
          @earendil-works/pi-ai@latest @earendil-works/pi-coding-agent@latest
          @earendil-works/pi-tui@latest typebox@latest
      - run: pnpm --filter @buyong/pi-ollama-cloud typecheck
      - run: pnpm --filter @buyong/pi-ollama-cloud test:unit
      - run: pnpm --filter @buyong/pi-ollama-cloud exec tsx scripts/cli/verify.ts --offline --report "$RUNNER_TEMP/ollama-latest-offline.json"

  ollama-smoke:
    needs: [select, checks]
    if: github.event_name != 'pull_request' && contains(fromJSON(needs.select.outputs.matrix).include.*.slug, 'pi-ollama-cloud')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    name: Smoke pi-ollama-cloud
    env:
      OLLAMA_API_KEY: ${{ secrets.OLLAMA_CLOUD_API_KEY }}
      IS_RELEASE: ${{ needs.select.outputs.is-release }}
    defaults:
      run:
        working-directory: apps/pi-ollama-cloud
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Require credentials for releases
        run: |
          echo "PI_CODING_AGENT_DIR=$RUNNER_TEMP/ollama-agent" >> "$GITHUB_ENV"
          if [ -z "$OLLAMA_API_KEY" ]; then
            if [ "$IS_RELEASE" = true ]; then
              echo "::error::Set OLLAMA_CLOUD_API_KEY before releasing pi-ollama-cloud"
              exit 1
            fi
            echo "Ollama live smoke skipped: OLLAMA_CLOUD_API_KEY is not configured." >> "$GITHUB_STEP_SUMMARY"
          fi
      - uses: actions/setup-node@v7
        if: env.OLLAMA_API_KEY != ''
        with:
          node-version: 24
          package-manager-cache: false
      - uses: pnpm/action-setup@v4
        if: env.OLLAMA_API_KEY != ''
      - run: pnpm install --frozen-lockfile
        if: env.OLLAMA_API_KEY != ''
      - name: Pack and extract the release contents
        if: env.OLLAMA_API_KEY != ''
        run: |
          pnpm pack --pack-destination "$RUNNER_TEMP/ollama-package"
          mkdir -p "$RUNNER_TEMP/ollama-extracted"
          tar -xzf "$RUNNER_TEMP/ollama-package/"*.tgz -C "$RUNNER_TEMP/ollama-extracted"
          mkdir -p "$RUNNER_TEMP/ollama-runtime"
          printf '{"private":true}\n' > "$RUNNER_TEMP/ollama-runtime/package.json"
          npm install --prefix "$RUNNER_TEMP/ollama-runtime" --omit=dev --ignore-scripts --legacy-peer-deps --no-audit --no-fund "$RUNNER_TEMP/ollama-package/"*.tgz
          echo "OLLAMA_PACKED_DIR=$RUNNER_TEMP/ollama-runtime/node_modules/@buyong/pi-ollama-cloud" >> "$GITHUB_ENV"
      - name: Basic provider smoke from the packed extension
        if: env.OLLAMA_API_KEY != ''
        run: >-
          pnpm exec pi --no-extensions --no-skills --no-prompt-templates --no-themes
          --no-context-files --no-mcp --no-session
          -e "$OLLAMA_PACKED_DIR"
          --model "ollama-cloud/gemma4:31b" --no-tools -p "Say hi in one word"
      - name: Thinking off from the packed extension
        if: env.OLLAMA_API_KEY != ''
        run: |
          pnpm exec pi --no-extensions --no-skills --no-prompt-templates --no-themes \
            --no-context-files --no-mcp --no-session \
            -e "$OLLAMA_PACKED_DIR" \
            --thinking off --model "ollama-cloud/glm-5.2" --no-tools --mode json -p 'hi' \
            > "$RUNNER_TEMP/ollama-thinking.jsonl"
          node --input-type=module <<'NODE'
          import { readFileSync } from 'node:fs';
          const events = readFileSync(`${process.env.RUNNER_TEMP}/ollama-thinking.jsonl`, 'utf8')
            .trim().split('\n').filter(Boolean).map(line => JSON.parse(line));
          const replies = events.filter(event => event.type === 'message_end' && event.message?.role === 'assistant')
            .map(event => event.message);
          if (!replies.length || replies.some(reply => ['error', 'aborted'].includes(reply.stopReason))) {
            throw new Error('Thinking-off smoke did not receive a successful assistant reply');
          }
          if (replies.some(reply => reply.content.some(block => block.type === 'thinking'))) {
            throw new Error('Thinking block found when thinking is off');
          }
          if (!replies.some(reply => reply.content.some(block => block.type === 'text' && block.text.trim()))) {
            throw new Error('Thinking-off smoke returned no text');
          }
          console.log('PASS: text response without thinking');
          NODE
      - name: Web tools smoke
        if: env.OLLAMA_API_KEY != ''
        run: pnpm run smoke:web-tools --package-dir "$OLLAMA_PACKED_DIR"

  publish:
    needs: [select, checks, auto-review-platforms, ollama-latest, ollama-smoke]
    if: >-
      always() && !cancelled() && github.event_name == 'push' &&
      startsWith(github.ref, 'refs/tags/') && needs.select.outputs.is-release == 'true' &&
      needs.checks.result == 'success' &&
      (!(contains(fromJSON(needs.select.outputs.matrix).include.*.slug, 'pi-codex-auto-review') ||
      contains(fromJSON(needs.select.outputs.matrix).include.*.slug, 'pi-codex')) ||
      needs.auto-review-platforms.result == 'success') &&
      (!contains(fromJSON(needs.select.outputs.matrix).include.*.slug, 'pi-ollama-cloud') ||
      (needs.ollama-latest.result == 'success' && needs.ollama-smoke.result == 'success'))
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      matrix: ${{ fromJSON(needs.select.outputs.matrix) }}
    name: Publish ${{ matrix.slug }}
    concurrency:
      group: publish-${{ matrix.slug }}
      cancel-in-progress: false
    permissions:
      contents: write
      id-token: write
    env:
      PACKAGE_NAME: ${{ matrix.name }}
      PACKAGE_DIR: ${{ matrix.path }}
      PACKAGE_SLUG: ${{ matrix.slug }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          # Trusted publishing requires npm >= 11.5.1.
          node-version: 24
          registry-url: https://registry.npmjs.org
          package-manager-cache: false
      - uses: pnpm/action-setup@v4
      - run: pnpm install --frozen-lockfile

      - name: Validate release metadata and extract notes
        id: metadata
        run: |
          node <<'NODE'
          const fs = require('node:fs');
          const path = require('node:path');
          const pkg = JSON.parse(fs.readFileSync(path.join(process.env.PACKAGE_DIR, 'package.json'), 'utf8'));
          const version = pkg.version;
          const match = typeof version === 'string' && version.match(/^(0|[1-9]\d*)\.(0|[1-9]\d*)\.(0|[1-9]\d*)(?:-([0-9A-Za-z.-]+))?(?:\+([0-9A-Za-z.-]+))?$/);
          if (!match || match[4]?.split('.').some(id => !id || /^0\d+$/.test(id)) || match[5]?.split('.').some(id => !id)) {
            throw new Error('package.json must contain a valid semantic version');
          }
          if (pkg.name !== process.env.PACKAGE_NAME || pkg.private === true || process.env.GITHUB_REF_NAME !== `${process.env.PACKAGE_SLUG}-v${version}`) {
            throw new Error('Release tag does not match the selected public package');
          }
          const repositoryURL = typeof pkg.repository === 'string' ? pkg.repository : pkg.repository?.url;
          if (repositoryURL?.replace(/^git\+/, '').replace(/\.git$/, '') !== `https://github.com/${process.env.GITHUB_REPOSITORY}`) {
            throw new Error('package.json repository must match this GitHub repository for npm provenance');
          }
          const identifier = match[4]?.split('.')[0];
          const distTag = identifier === undefined ? 'latest' : /^\d+$/.test(identifier) ? 'next' : identifier;
          fs.appendFileSync(process.env.GITHUB_OUTPUT, `dist-tag=${distTag}\nprerelease=${identifier !== undefined}\n`);
          NODE
          # The English CHANGELOG.md section, then the Korean CHANGELOG.ko.md one; each needs exactly one nonempty section.
          version=$(node -p "require('./$PACKAGE_DIR/package.json').version")
          (cd "$PACKAGE_DIR" && node "$GITHUB_WORKSPACE/scripts/release/changelog.mjs" notes "$version") > "$RUNNER_TEMP/release-notes.md"

      - name: Pack with resolved workspace and catalog references
        run: |
          pack_args=()
          if node -e "process.exit(require('./$PACKAGE_DIR/package.json').bundleDependencies ? 0 : 1)"; then
            pack_args+=(--config.node-linker=hoisted)
          else
            pnpm --filter "$PACKAGE_NAME^..." run --if-present build
          fi
          pnpm --dir "$PACKAGE_DIR" pack "${pack_args[@]}" --pack-destination "$RUNNER_TEMP/package"
      - name: Publish the selected package to npm through OIDC
        env:
          DIST_TAG: ${{ steps.metadata.outputs.dist-tag }}
        run: |
          tarballs=("$RUNNER_TEMP/package/"*.tgz)
          if [ "${#tarballs[@]}" -ne 1 ] || [ ! -f "${tarballs[0]}" ]; then
            echo "::error::Expected exactly one package tarball"
            exit 1
          fi
          npm publish "${tarballs[0]}" --tag "$DIST_TAG"

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          IS_PRERELEASE: ${{ steps.metadata.outputs.prerelease }}
        run: |
          flags=()
          if [ "$IS_PRERELEASE" = true ]; then flags+=(--prerelease); fi
          gh release create "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --verify-tag \
            --title "$GITHUB_REF_NAME" --notes-file "$RUNNER_TEMP/release-notes.md" "${flags[@]}"
