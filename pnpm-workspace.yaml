packages:
  - apps/*
  - packages/*

# One version of the Pi host packages and the toolchain for every workspace package.
catalog:
  "@biomejs/biome": 2.6.4
  "@earendil-works/pi-ai": 1.4.0
  "@earendil-works/pi-coding-agent": 1.4.0
  "@earendil-works/pi-tui": 1.4.0
  "@types/node": 26.6.6
  "@types/proper-lockfile": 4.1.4
  "@typescript/native-preview": 7.0.0-dev.20260707.2
  tsx: 4.23.15
  typebox: 1.4.3
  typescript: 6.0.3
  vitest: 4.1.12

# Package-specific Pi SDK baselines; do not upgrade unrelated apps for one consumer.
catalogs:
  memory:
    "@earendil-works/pi-ai": 1.4.0
    "@earendil-works/pi-coding-agent": 1.4.0
    "@earendil-works/pi-tui": 1.4.0
  devin:
    "@earendil-works/pi-ai": 1.4.0
    "@earendil-works/pi-coding-agent": 1.4.0
    "@earendil-works/pi-tui": 1.4.0
  mcp-adapter:
    "@earendil-works/pi-ai": 1.4.0
    "@earendil-works/pi-coding-agent": 1.4.0
    "@earendil-works/pi-tui": 1.4.0

# Transitive dependencies of the Pi host packages; type checking does not need their install scripts.
ignoredBuiltDependencies:
  - "@google/genai"
  - protobufjs
