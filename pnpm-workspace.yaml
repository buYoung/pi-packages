packages:
  - apps/*
  - packages/*

# One version of the Pi host packages and the toolchain for every workspace package.
catalog:
  "@biomejs/biome": 2.6.9
  "@earendil-works/pi-ai": 1.6.1
  "@earendil-works/pi-coding-agent": 1.6.1
  "@earendil-works/pi-tui": 1.6.1
  "@types/node": 26.6.11
  "@types/proper-lockfile": 4.1.4
  esbuild: 0.28.2
  tsx: 4.23.15
  typescript: 7.0.2
  vitest: 5.1.2

# Package-specific Pi SDK baselines; do not upgrade unrelated apps for one consumer.
catalogs:
  memory:
    "@earendil-works/pi-ai": 1.6.1
    "@earendil-works/pi-coding-agent": 1.6.1
    "@earendil-works/pi-tui": 1.6.1
  devin:
    "@earendil-works/pi-ai": 1.6.1
    "@earendil-works/pi-coding-agent": 1.6.1
    "@earendil-works/pi-tui": 1.6.1
  mcp-adapter:
    "@earendil-works/pi-ai": 1.6.1
    "@earendil-works/pi-coding-agent": 1.6.1
    "@earendil-works/pi-tui": 1.6.1

# Install scripts the workspace does not need. @google/genai and protobufjs come with the Pi host packages, and type
# checking does not use their scripts; esbuild and @bufbuild/buf load their platform binary packages without them.
allowBuilds:
  "@bufbuild/buf": false
  "@google/genai": false
  esbuild: false
  protobufjs: false

# Pi loads the image-generation skill through the pi-codex bundle; pnpm does not provision it as an agent skill.
permissions:
  "@buyong/pi-codex-image-gen":
    skills: false
